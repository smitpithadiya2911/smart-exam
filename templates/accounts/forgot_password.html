{% extends 'base.html' %}
{% block public_content %}
<div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
  <div class="glass-card p-4 p-md-5 shadow-lg" style="max-width: 450px; width: 100%;">
    <div class="text-center mb-4">
      <i class="bi bi-key-fill display-5 text-primary"></i>
      <h3 class="font-heading mt-2">Reset Password</h3>
      <p class="text-muted small">Enter registered email to receive an OTP</p>
    </div>

    <form method="post">
      {% csrf_token %}
      <div class="mb-4">
        <label class="form-label small">Registered Email</label>
        {{ form.email }}
      </div>
      <button type="submit" class="btn btn-glass-primary w-100 py-2.5">Send OTP</button>
      <div class="text-center mt-3">
        <a href="{% url 'login' %}" class="small text-decoration-none text-primary">&larr; Back to Login</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
