{% extends 'base.html' %}
{% block public_content %}
<div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
  <div class="glass-card p-4 p-md-5 shadow-lg" style="max-width: 450px; width: 100%;">
    <div class="text-center mb-4">
      <i class="bi bi-shield-check display-5 text-success"></i>
      <h3 class="font-heading mt-2">Verify OTP Code</h3>
      <p class="text-muted small">Enter OTP sent to <code>{{ email }}</code></p>
    </div>

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label small">6-Digit OTP</label>
        {{ form.otp }}
      </div>
      <div class="mb-4">
        <label class="form-label small">New Password</label>
        <div class="position-relative">
          {{ form.new_password }}
          <button type="button" class="btn btn-link position-absolute end-0 top-50 translate-middle-y me-2 text-muted p-1" onclick="togglePassword(null, this)" style="text-decoration: none; z-index: 100; cursor: pointer;" title="Toggle password visibility">
            <i class="bi bi-eye-fill fs-5"></i>
          </button>
        </div>
      </div>


      <button type="submit" class="btn btn-glass-primary w-100 py-2.5">Set New Password</button>
    </form>
  </div>
</div>
{% endblock %}
