{% extends 'base.html' %}
{% block content %}
<div class="container" style="max-width: 500px;" data-aos="fade-up">
  <div class="glass-card text-center p-4">
    <i class="bi bi-exclamation-triangle-fill display-3 text-danger mb-3"></i>
    <h4 class="font-heading">Confirm Delete Subject</h4>
    <p class="text-muted">Are you sure you want to delete <strong>{{ subject.name }}</strong>?</p>
    <form method="post">
      {% csrf_token %}
      <div class="d-flex justify-content-center gap-2 mt-4">
        <a href="{% url 'subject_list' %}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-danger">Confirm Delete</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
