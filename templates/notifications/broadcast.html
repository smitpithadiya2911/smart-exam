{% extends 'base.html' %}
{% block title %}Broadcast Announcement - EdTech System{% endblock %}

{% block content %}
<div class="container" data-aos="fade-up" style="max-width: 650px;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="font-heading fw-bold mb-0">Broadcast Announcement</h2>
    <a href="{% url 'notification_list' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Back</a>
  </div>

  <div class="glass-card">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3"><label class="form-label small font-monospace">ANNOUNCEMENT TITLE</label>{{ form.title }}</div>
      <div class="mb-4"><label class="form-label small font-monospace">BROADCAST MESSAGE BODY</label>{{ form.message }}</div>

      <button type="submit" class="btn btn-glass-primary w-100 py-2.5"><i class="bi bi-send me-1"></i> Broadcast to All Users</button>
    </form>
  </div>
</div>
{% endblock %}
