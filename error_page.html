<script>
  function toggleAdminPassword(btn) {
    var input = document.getElementById('id_password');
    if (input) {
      var isPassword = (input.type === 'password');
      input.type = isPassword ? 'text' : 'password';
      var icon = btn.querySelector('i') || btn;
      if (icon) {
        icon.className = isPassword ? 'bi bi-eye-slash-fill' : 'bi bi-eye-fill';
      }
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    const uInput = document.getElementById('id_username');
    const pInput = document.getElementById('id_password');
    if (uInput && uInput.value === 'admin') uInput.value = '';
    if (pInput) pInput.value = '';
  });
</script>
